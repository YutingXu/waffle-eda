name: Editing soak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editing-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editing-soak:
    name: Five-minute editing session
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, atrium]
    timeout-minutes: 35
    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned CI images
        timeout-minutes: 20
        run: scripts/ci-linux.sh images
      - name: Soak the full-size board and schematic in Chromium
        id: soak
        timeout-minutes: 12
        shell: bash
        run: |
          export OUT="$RUNNER_TEMP/editing-soak-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$OUT"
          scripts/ci-linux.sh soak | tee "$OUT/session.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.soak.outcome != 'skipped' }}
        with:
          name: waffle-editing-soak
          path: ${{ runner.temp }}/editing-soak-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Clean workspace
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
