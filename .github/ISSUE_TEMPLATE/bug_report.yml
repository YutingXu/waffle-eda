name: Bug report
description: Something in Waffle does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems go to [SECURITY.md](https://github.com/YutingXu/waffle-eda/blob/main/SECURITY.md), not here.**
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the example design
        2. Press P T on the board
        3. ...
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - macOS app
        - Windows app
        - Linux app
        - Browser (app/index.html)
        - MCP server or CLI
        - Extension or Scripting Console
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Waffle version
      description: Help → About Waffle
      placeholder: "0.8.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "macOS 26.1 / Windows 11 24H2 / Ubuntu 24.04"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Schematic
        - PCB editing
        - Routing
        - Pours
        - Rules, DRC or ERC
        - 3D view
        - Outputs and fabrication
        - Library
        - BOM
        - Import or export
        - History and Compare
        - Collaboration
        - Simulation
        - AI Assistant, MCP or CLI
        - Extensions
        - UI, themes or shortcuts
        - Performance
        - Other
  - type: textarea
    id: file
    attributes:
      label: A file that reproduces it (optional)
      description: |
        A small project that shows the problem helps most. Drag a .waffle file or a .zip here.
        Remove anything confidential first; a minimal synthetic design is best. Never attach customer or proprietary designs.
  - type: textarea
    id: logs
    attributes:
      label: Messages or screenshots (optional)
      description: Include relevant messages or a cropped screenshot you can share publicly.
  - type: textarea
    id: diagnostics
    attributes:
      label: Waffle diagnostics (optional)
      description: |
        In Waffle 0.8.1 or later, choose Help › Troubleshooting › Crash Diagnostics… to preview the report. Use Copy report to paste it here, or Save report… to attach waffle-diagnostics.json.
        For lag or high resource use, turn on Frame Monitor in the same menu, repeat the action, then open the report while Frame Monitor is still on.
