<script>
const result = document.getElementById("result");
(location.hash === "#via-marks" ? atriumCanvasViaMarkZoom() : atriumCanvasDamage()).then(report => {
  result.textContent = JSON.stringify(report);
  result.dataset.status = report.failures.length ? "fail" : "pass";
}, error => {
  result.textContent = error.stack;
  result.dataset.status = "fail";
});
